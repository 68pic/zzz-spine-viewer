<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine WebGL Prototype - リシュア</title>
    <script src="https://unpkg.com/@esotericsoftware/spine-webgl@4.2.*/dist/iife/spine-webgl.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background: #252525;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .info {
            color: #aaa;
            font-size: 0.9rem;
        }

        .controls {
            margin-top: 15px;
        }

        .checkbox-label {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            transition: all 0.3s ease;
            user-select: none;
        }

        .checkbox-label:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .checkbox-label input {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        #canvas {
            position: absolute;
            top: 140px;
            left: 0;
            width: 100%;
            height: calc(100% - 140px);
            cursor: grab;
        }

        #canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Spine WebGL Prototype</h1>
        <div class="info">マウスホイール: ズーム | ドラッグ: パン</div>
        <div class="controls">
            <label class="checkbox-label">
                <input type="checkbox" id="show-bones">
                <span>ボーン表示 (Show Bones)</span>
            </label>
        </div>
    </div>
    <canvas id="canvas"></canvas>

    <script>
        class LuciaApp {
            constructor() {
                this.skeleton = null;
                this.animationState = null;
                this.cameraController = null;
                this.debugRenderer = null;
                this.debugShader = null;
                this.shapes = null;
                this.showBones = false;
            }

            loadAssets(canvas) {
                // JSONファイルとアトラスを読み込む
                canvas.assetManager.loadText("assets/spine/リシュア.json");
                canvas.assetManager.loadTextureAtlas("assets/spine/リシュア.atlas");
            }

            initialize(canvas) {
                let assetManager = canvas.assetManager;

                // アトラスを取得
                var atlas = assetManager.require("assets/spine/リシュア.atlas");

                // AtlasAttachmentLoaderを作成
                var atlasLoader = new spine.AtlasAttachmentLoader(atlas);

                // SkeletonJsonインスタンスを作成（JSONファイル用）
                var skeletonJson = new spine.SkeletonJson(atlasLoader);

                // JSONをパースしてスケルトンデータを作成
                var skeletonData = skeletonJson.readSkeletonData(assetManager.require("assets/spine/リシュア.json"));
                this.skeleton = new spine.Skeleton(skeletonData);

                // スケルトンの位置を設定（画面中央下部）
                this.skeleton.x = 0;
                this.skeleton.y = 0;

                // AnimationStateを作成し、ループアニメーションを設定
                var animationStateData = new spine.AnimationStateData(skeletonData);
                this.animationState = new spine.AnimationState(animationStateData);
                this.animationState.setAnimation(0, "loop", true);

                // CameraControllerを追加（ズーム・パン機能を有効化）
                this.cameraController = new spine.CameraController(canvas.htmlCanvas, canvas.renderer.camera);

                // DebugRendererの初期化
                const gl = canvas.context.gl;
                this.debugRenderer = new spine.SkeletonDebugRenderer(gl);
                this.debugRenderer.drawBones = true;
                this.debugRenderer.drawRegionAttachments = false;
                this.debugRenderer.drawMeshHull = false;
                this.debugRenderer.drawMeshTriangles = false;
                this.debugRenderer.drawPaths = false;

                // デバッグ描画用のシェーダーとShapeRendererを作成
                this.debugShader = spine.Shader.newColored(gl);
                this.shapes = new spine.ShapeRenderer(gl);

                // チェックボックスのイベントリスナー
                const checkbox = document.getElementById('show-bones');
                checkbox.addEventListener('change', (e) => {
                    this.showBones = e.target.checked;
                });

                console.log("Lucia loaded successfully! CameraController and DebugRenderer enabled.");
            }

            update(canvas, delta) {
                // アニメーションステートを更新
                this.animationState.update(delta);
                // スケルトンに適用
                this.animationState.apply(this.skeleton);
                // ボーンのトランスフォームを更新
                this.skeleton.updateWorldTransform(spine.Physics.update);
            }

            render(canvas) {
                let renderer = canvas.renderer;

                // ビューポートをキャンバス全体にリサイズ
                renderer.resize(spine.ResizeMode.Expand);

                // 背景をクリア
                canvas.clear(0.1, 0.1, 0.1, 1);

                // レンダリング開始
                renderer.begin();

                // スケルトンを描画（premultiplied alphaを無効化）
                renderer.drawSkeleton(this.skeleton, false);

                // レンダリング完了
                renderer.end();

                // ボーン表示が有効な場合はデバッグレンダリング
                if (this.showBones && this.debugRenderer && this.debugShader && this.shapes) {
                    // デバッグシェーダーをバインド
                    this.debugShader.bind();

                    // カメラの変換行列を取得して設定
                    const mvp = renderer.camera.projectionView;
                    this.debugShader.setUniform4x4f(spine.Shader.MVP_MATRIX, mvp.values);

                    // Shape描画開始
                    this.shapes.begin(this.debugShader);

                    // デバッグレンダリング
                    this.debugRenderer.draw(this.shapes, this.skeleton);

                    // Shape描画終了
                    this.shapes.end();

                    // シェーダーをアンバインド
                    this.debugShader.unbind();
                }
            }
        }

        // SpineCanvasを作成してアプリを起動
        new spine.SpineCanvas(document.getElementById("canvas"), {
            app: new LuciaApp()
        });
    </script>
</body>
</html>
