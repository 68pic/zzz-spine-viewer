<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZZZ Spine Viewer</title>
    <script src="https://unpkg.com/@esotericsoftware/spine-webgl@4.2.*/dist/iife/spine-webgl.js"></script>
    <link rel="stylesheet" href="css/style-fullscreen.css">
</head>

<body>
    <!-- フルスクリーンキャンバス -->
    <canvas id="spine-canvas"></canvas>
    <div id="loading">Loading...</div>

    <!-- UIオーバーレイ -->
    <div class="ui-overlay">
        <div class="top-bar">
            <div class="character-info">
                <div class="character-name-container" id="character-name-container">
                    <!-- Names will be injected here via JS -->
                    <div class="name-line ja"></div>
                    <div class="name-line en"></div>
                    <div class="name-line cn"></div>
                </div>
            </div>
        </div>

        <div class="character-selector">
            <img src="assets/ui/icon_YoShunkou.png" alt="YoShunkou" class="character-icon" data-character="yoshunkou">
            <img src="assets/ui/icon_zhao.png" alt="Zhao" class="character-icon" data-character="zhao">
            <img src="assets/ui/icon_Lucia.png" alt="リシュア" class="character-icon" data-character="lucia">
            <img src="assets/ui/icon_Yidhari.png" alt="イドリー" class="character-icon" data-character="yidhari">
            <img src="assets/ui/icon_Seed.png" alt="Seed" class="character-icon" data-character="seed">
            <img src="assets/ui/icon_Aofeisi.png" alt="Aofeisi" class="character-icon" data-character="aofeisi">
            <img src="assets/ui/icon_Youye.png" alt="柚叶" class="character-icon" data-character="youye">
            <img src="assets/ui/icon_Alice.png" alt="爱丽丝" class="character-icon" data-character="alice">
            <img src="assets/ui/icon_Jufufu.png" alt="橘福福" class="character-icon" data-character="jufufu">
            <img src="assets/ui/icon_Yixuan.png" alt="儀玄" class="character-icon" data-character="yixuan">
            <img src="assets/ui/icon_SPAnbi.png" alt="SPアンビー" class="character-icon" data-character="spanbi">
            <img src="assets/ui/icon_Trigger.png" alt="トリガー" class="character-icon" data-character="trigger">
            <img src="assets/ui/icon_Evelyn.png" alt="Evelyn" class="character-icon" data-character="evelyn">
            <img src="assets/ui/icon_YaoJiayin.png" alt="Yao" class="character-icon" data-character="yao">
            <img src="assets/ui/icon_Vivian.png" alt="Vivian" class="character-icon" data-character="vivian">
            <img src="assets/ui/icon_Hugo.png" alt="Hugo" class="character-icon" data-character="hugo">
            <img src="assets/ui/icon_Qianyuyouzhen.png" alt="悠真" class="character-icon" data-character="youzhen">
            <img src="assets/ui/icon_Xingjianya.png" alt="雅" class="character-icon" data-character="xingjianya">
        </div>

        <div class="bottom-bar">
            <div class="controls-ui">
                <label class="toggle-switch">
                    <input type="checkbox" id="toggle-bones">
                    <span class="toggle-slider"></span>
                    <span class="toggle-label">ボーン表示</span>
                </label>
            </div>
        </div>
    </div>

    <script src="js/app-new.js"></script>
</body>

</html>
